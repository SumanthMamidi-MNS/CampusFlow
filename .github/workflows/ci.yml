name: CI

# The suite is run twice in spirit: against PostgreSQL (the production engine,
# via TEST_DATABASE_URL) for the backend, and the real typecheck/build gate for
# the frontend. `npx tsc --noEmit` is deliberately absent — the root tsconfig is
# a solution file and would check nothing (see docs/memory.md).

on:
  push:
    branches: [main, master, "fix/**", "feature/**", "wave/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest on PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow
          POSTGRES_DB: campusflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run --extra dev ruff check .

      # Formatting is applied to touched files, not enforced repo-wide (the
      # existing tree is not uniformly `ruff format`-clean, so a global gate
      # would fail on files this branch does not change).
      - name: Tests (PostgreSQL)
        env:
          DEBUG: "true"
          TEST_DATABASE_URL: postgresql+asyncpg://campusflow:campusflow@localhost:5432/campusflow_test
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is the typecheck: tsc -b over project references plus
      # the bundler pass, which is the gate that catches JSX narrowing errors.
      - name: Build
        run: npm run build

      # The measurement sample must never end up in the bundle: a fresh build
      # must contain no dev-measure assets.
      - name: Assert the detector sample is not in the bundle
        run: |
          if [ -d dist/dev-measure ]; then
            echo "dist/dev-measure must not exist (git-ignored measurement sample)" >&2
            exit 1
          fi
          echo "dist is clean"
