<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>CampusFlow — Academic & Examination Portal</title>
    <!--
      The boot screen. It is the first paint, so it ships inline: no font, bundle
      or network request is needed for the brand to appear. React replaces it
      with the same design (SplashScreen.tsx) once the session check resolves, so
      keep the two in step.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f8fafc;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        /* The handover is owned here, not by an inline style in main.tsx: the
           overlay and its contents have to leave as one surface. Duration and
           easing match BOOT_EXIT_MS in main.tsx. */
        transition: opacity 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #boot .mark,
      #boot .word,
      #boot .tag,
      #boot .roles,
      #boot .bar,
      #boot .caption,
      #boot .foot {
        transition:
          opacity 0.34s ease,
          transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* The curtain lifts: the panel fades out while the brand inside it rises
         a few pixels and shrinks by a hair, so the page behind is revealed
         rather than switched on. */
      #boot.is-leaving {
        opacity: 0;
      }

      #boot.is-leaving > * {
        opacity: 0;
        transform: translateY(-6px) scale(0.99);
      }

      #boot::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 560px;
        height: 560px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(199, 210, 254, 0.45), rgba(199, 210, 254, 0) 70%);
        pointer-events: none;
      }

      #boot::after {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(79, 70, 229, 0.7), transparent);
      }

      #boot .mark {
        position: relative;
        width: 78px;
        height: 78px;
        filter: drop-shadow(0 14px 28px rgba(23, 20, 64, 0.28));
      }

      #boot .word {
        margin-top: 26px;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #0f172a;
      }

      #boot .word span {
        color: #4f46e5;
      }

      #boot .tag {
        margin: 8px 0 0;
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
      }

      #boot .roles {
        margin: 20px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      #boot .bar {
        position: relative;
        margin-top: 40px;
        width: 240px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }

      #boot .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 33%;
        border-radius: 999px;
        background: linear-gradient(90deg, #818cf8, #4f46e5, #818cf8);
        animation: boot-sweep 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      #boot .caption {
        margin: 12px 0 0;
        font-size: 11px;
        font-weight: 500;
        color: #94a3b8;
      }

      #boot .foot {
        position: absolute;
        bottom: 28px;
        margin: 0;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.8);
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          width: 100%;
          opacity: 0.45;
          animation: none;
        }

        /* A cross-fade is motion too; a reader who asked for less gets the page
           at once rather than a 0.42 s dissolve. */
        #boot,
        #boot .mark,
        #boot .word,
        #boot .tag,
        #boot .roles,
        #boot .bar,
        #boot .caption,
        #boot .foot {
          transition-duration: 0.01s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading CampusFlow">
      <svg class="mark" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="boot-border" x1="6" y1="4" x2="90" y2="92" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#C7D2FE" />
            <stop offset="42%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#3730A3" />
          </linearGradient>
          <linearGradient id="boot-bg" x1="48" y1="3" x2="48" y2="93" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#302E7A" />
            <stop offset="52%" stop-color="#1D1B4E" />
            <stop offset="100%" stop-color="#0F0E2C" />
          </linearGradient>
          <linearGradient id="boot-sheen" x1="48" y1="3" x2="48" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.17" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="boot-cap" x1="22" y1="28" x2="74" y2="66" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#C7D2FE" />
          </linearGradient>
          <clipPath id="boot-clip"><rect x="3" y="3" width="90" height="90" rx="22" /></clipPath>
        </defs>
        <rect x="1.5" y="1.5" width="93" height="93" rx="23" fill="url(#boot-bg)" />
        <g clip-path="url(#boot-clip)">
          <rect x="3" y="3" width="90" height="46" fill="url(#boot-sheen)" />
        </g>
        <rect x="1.5" y="1.5" width="93" height="93" rx="23" stroke="url(#boot-border)" stroke-width="3" />
        <g transform="translate(-0.6 3.7)">
          <path d="M48 27 L80 39 L48 51 L16 39 Z" fill="url(#boot-cap)" />
          <path d="M48 27 L80 39 L48 51 Z" fill="#A5B4FC" opacity="0.35" />
          <path d="M33 45.4 V55 C33 59 39.5 61.5 48 61.5 C56.5 61.5 63 59 63 55 V45.4 L48 51 Z" fill="url(#boot-cap)" />
          <path d="M48 51 L63 45.4 V55 C63 59 56.5 61.5 48 61.5 Z" fill="#A5B4FC" opacity="0.32" />
          <path d="M80 39 V52" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" />
          <circle cx="80" cy="55.2" r="2.4" fill="#A5B4FC" />
        </g>
      </svg>

      <div class="word">Campus<span>Flow</span></div>
      <p class="tag">College LMS &amp; secure examination platform</p>
      <p class="roles">Campus leads &middot; Faculty &middot; Exam controllers &middot; Students</p>

      <div class="bar"><i></i></div>
      <p class="caption">Preparing your workspace&hellip;</p>
      <p class="foot">Single-institution deployment &middot; no public sign-up</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
