<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>CampusFlow — Academic & Examination Portal</title>
    <!--
      The boot screen. It is the first paint, so it ships inline: no font, bundle
      or network request is needed for the brand to appear. React replaces it
      with the same design (SplashScreen.tsx) once the session check resolves, so
      keep the two in step.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f8fafc;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        transition: opacity 0.28s ease;
      }

      #boot::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 560px;
        height: 560px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(199, 210, 254, 0.45), rgba(199, 210, 254, 0) 70%);
        pointer-events: none;
      }

      #boot::after {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(79, 70, 229, 0.7), transparent);
      }

      #boot .mark {
        position: relative;
        width: 78px;
        height: 78px;
        filter: drop-shadow(0 14px 28px rgba(23, 20, 64, 0.28));
      }

      #boot .word {
        margin-top: 26px;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #0f172a;
      }

      #boot .word span {
        color: #4f46e5;
      }

      #boot .tag {
        margin: 8px 0 0;
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
      }

      #boot .roles {
        margin: 20px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      #boot .bar {
        position: relative;
        margin-top: 40px;
        width: 240px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }

      #boot .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 33%;
        border-radius: 999px;
        background: linear-gradient(90deg, #818cf8, #4f46e5, #818cf8);
        animation: boot-sweep 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      #boot .caption {
        margin: 12px 0 0;
        font-size: 11px;
        font-weight: 500;
        color: #94a3b8;
      }

      #boot .foot {
        position: absolute;
        bottom: 28px;
        margin: 0;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.8);
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          width: 100%;
          opacity: 0.45;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading CampusFlow">
      <svg class="mark" viewBox="6 10 84 84" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="boot-border" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#A5B4FC" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#312E81" />
          </linearGradient>
          <linearGradient id="boot-bg" x1="48" y1="6" x2="48" y2="90" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#111533" />
            <stop offset="100%" stop-color="#0A0C22" />
          </linearGradient>
          <linearGradient id="boot-cap" x1="24" y1="28" x2="72" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E0E7FF" />
            <stop offset="100%" stop-color="#818CF8" />
          </linearGradient>
        </defs>
        <rect x="6" y="10" width="84" height="84" rx="20" fill="url(#boot-bg)" stroke="url(#boot-border)" stroke-width="3" />
        <path d="M48 28 L76 42 L48 56 L20 42 Z" fill="url(#boot-cap)" />
        <path d="M32 50 V62 C32 66 40 70 48 70 C56 70 64 66 64 62 V50 L48 58 Z" fill="url(#boot-cap)" opacity="0.85" />
        <path d="M76 42 V58" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
      </svg>

      <div class="word">Campus<span>Flow</span></div>
      <p class="tag">College LMS &amp; secure examination platform</p>
      <p class="roles">Campus leads &middot; Faculty &middot; Exam controllers &middot; Students</p>

      <div class="bar"><i></i></div>
      <p class="caption">Preparing your workspace&hellip;</p>
      <p class="foot">Single-institution deployment &middot; no public sign-up</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
