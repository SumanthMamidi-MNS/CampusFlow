<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 112" width="492" height="112" fill="none" role="img" aria-label="CampusFlow">
  <!--
    The lockup: the house mark and the wordmark on one 492x112 canvas.

    The mark is the same 96x96 artwork as `campusflow-mark.svg` and
    `BrandMark.tsx`, placed at 8,8 so its centre is y=56 — the optical centre of
    the 58px wordmark — and the wordmark starts at x=124, clear of the tile's
    glow. Nothing is scaled or clipped here: the two files are pixel-identical
    for the mark, so the README and the app cannot drift apart.

    The wordmark follows the page theme; the tile never needs a panel behind it.
  -->
  <defs>
    <linearGradient id="c-border" x1="6" y1="4" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="42%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="c-bg" x1="48" y1="3" x2="48" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#302E7A"/>
      <stop offset="52%" stop-color="#1D1B4E"/>
      <stop offset="100%" stop-color="#0F0E2C"/>
    </linearGradient>
    <linearGradient id="c-sheen" x1="48" y1="3" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c-cap" x1="22" y1="28" x2="74" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <clipPath id="c-clip"><rect x="3" y="3" width="90" height="90" rx="22"/></clipPath>
  </defs>

  <style>
    .cf-name { fill: #0F172A; }
    .cf-flow { fill: #4F46E5; }
    @media (prefers-color-scheme: dark) {
      .cf-name { fill: #FFFFFF; }
      .cf-flow { fill: #818CF8; }
    }
  </style>

  <g transform="translate(8 8)">
    <rect x="1.5" y="1.5" width="93" height="93" rx="23" fill="url(#c-bg)"/>
    <g clip-path="url(#c-clip)">
      <rect x="3" y="3" width="90" height="46" fill="url(#c-sheen)"/>
    </g>
    <rect x="1.5" y="1.5" width="93" height="93" rx="23" stroke="url(#c-border)" stroke-width="3"/>

    <g transform="translate(-0.6 3.7)">
      <path d="M48 27 L80 39 L48 51 L16 39 Z" fill="url(#c-cap)"/>
      <path d="M48 27 L80 39 L48 51 Z" fill="#A5B4FC" opacity="0.35"/>
      <path d="M33 45.4 V55 C33 59 39.5 61.5 48 61.5 C56.5 61.5 63 59 63 55 V45.4 L48 51 Z" fill="url(#c-cap)"/>
      <path d="M48 51 L63 45.4 V55 C63 59 56.5 61.5 48 61.5 Z" fill="#A5B4FC" opacity="0.32"/>
      <path d="M80 39 V52" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="55.2" r="2.4" fill="#A5B4FC"/>
    </g>
  </g>

  <text class="cf-name" x="124" y="77" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.4">Campus<tspan class="cf-flow">Flow</tspan></text>
</svg>
