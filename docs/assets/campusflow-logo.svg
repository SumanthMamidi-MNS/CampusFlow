<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 116" width="476" height="116" fill="none" role="img" aria-label="CampusFlow">
  <defs>
    <linearGradient id="c-border" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="c-bg" x1="48" y1="6" x2="48" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111533"/>
      <stop offset="100%" stop-color="#0A0C22"/>
    </linearGradient>
    <linearGradient id="c-cap" x1="24" y1="28" x2="72" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!--
    The house mark: the square, the graduate's cap, the wordmark. Tile, cap and
    type geometry are taken verbatim from the project's original banner so the
    mark is identical across the portfolio. Only the wordmark fills adapt to the
    page's theme, so the lockup needs no panel behind it.
  -->
  <style>
    .cf-name { fill: #0F172A; }
    .cf-flow { fill: #4F46E5; }
    @media (prefers-color-scheme: dark) {
      .cf-name { fill: #FFFFFF; }
      .cf-flow { fill: #818CF8; }
    }
  </style>

  <rect x="6" y="10" width="84" height="84" rx="20" fill="url(#c-bg)" stroke="url(#c-border)" stroke-width="3"/>
  <!-- graduation cap -->
  <path d="M48 28 L76 42 L48 56 L20 42 Z" fill="url(#c-cap)"/>
  <path d="M32 50 V62 C32 66 40 70 48 70 C56 70 64 66 64 62 V50 L48 58 Z" fill="url(#c-cap)" opacity="0.85"/>
  <path d="M76 42 V58" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <text class="cf-name" x="112" y="76" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Campus<tspan class="cf-flow">Flow</tspan></text>
</svg>
