<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" fill="none">
  <defs>
    <linearGradient id="panel" x1="320" y1="0" x2="320" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121A38"/>
      <stop offset="55%" stop-color="#0E1329"/>
      <stop offset="100%" stop-color="#0A0C22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="640" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="c-banner-border" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="c-banner-bg" x1="48" y1="6" x2="48" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111533"/>
      <stop offset="100%" stop-color="#0A0C22"/>
    </linearGradient>
    <linearGradient id="c-banner-cap" x1="24" y1="28" x2="72" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="139" rx="20" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="639" height="139" rx="20" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="637" height="137" rx="19" stroke="url(#edge)" stroke-width="1.5"/>

  <g transform="translate(50, 12)">
  <rect x="6" y="10" width="84" height="84" rx="20" fill="url(#c-banner-bg)" stroke="url(#c-banner-border)" stroke-width="3"/>
  <!-- graduation cap -->
  <path d="M48 28 L76 42 L48 56 L20 42 Z" fill="url(#c-banner-cap)"/>
  <path d="M32 50 V62 C32 66 40 70 48 70 C56 70 64 66 64 62 V50 L48 58 Z" fill="url(#c-banner-cap)" opacity="0.85"/>
  <path d="M76 42 V58" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="76" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#FFFFFF">Campus<tspan fill="#818CF8">Flow</tspan></text>
  </g>
