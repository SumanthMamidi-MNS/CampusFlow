<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-label="CampusFlow">
  <!--
    The house mark on a 96x96 canvas.

    The tile is drawn *inside* the canvas: a 93x93 rect at 1.5 with a 3px stroke
    fills 0 → 96 edge to edge, so nothing is clipped at any size. The cap is
    centred optically at (48,48): the board is a 62-wide diamond from y 26.5 to
    56.5, the bowl curves to a floor at y 69.5, and the tassel hangs from the
    board's right corner.

    `BrandMark.tsx`, `favicon.svg`, the boot screen in `index.html` and
    `campusflow-logo.svg` carry the same artwork; change them together.
  -->
  <defs>
    <linearGradient id="cfm-border" x1="6" y1="4" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="42%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="cfm-bg" x1="48" y1="3" x2="48" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#302E7A"/>
      <stop offset="52%" stop-color="#1D1B4E"/>
      <stop offset="100%" stop-color="#0F0E2C"/>
    </linearGradient>
    <linearGradient id="cfm-sheen" x1="48" y1="3" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cfm-cap" x1="22" y1="28" x2="74" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <clipPath id="cfm-clip"><rect x="3" y="3" width="90" height="90" rx="22"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="93" height="93" rx="23" fill="url(#cfm-bg)"/>
  <g clip-path="url(#cfm-clip)">
    <rect x="3" y="3" width="90" height="46" fill="url(#cfm-sheen)"/>
  </g>
  <rect x="1.5" y="1.5" width="93" height="93" rx="23" stroke="url(#cfm-border)" stroke-width="3"/>

  <g transform="translate(-0.6 3.7)">
    <path d="M48 27 L80 39 L48 51 L16 39 Z" fill="url(#cfm-cap)"/>
    <path d="M48 27 L80 39 L48 51 Z" fill="#A5B4FC" opacity="0.35"/>
    <path d="M33 45.4 V55 C33 59 39.5 61.5 48 61.5 C56.5 61.5 63 59 63 55 V45.4 L48 51 Z" fill="url(#cfm-cap)"/>
    <path d="M48 51 L63 45.4 V55 C63 59 56.5 61.5 48 61.5 Z" fill="#A5B4FC" opacity="0.32"/>
    <path d="M80 39 V52" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="55.2" r="2.4" fill="#A5B4FC"/>
  </g>
</svg>
