<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132.3 32" width="132.3" height="32" fill="none" role="img" aria-label="License: MIT">
  <defs>
    <linearGradient id="license-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4D4D4"/>
      <stop offset="50%" stop-color="#737373"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <clipPath id="license-clip">
      <rect x="0.5" y="0.5" width="131.3" height="31" rx="8"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; }
    .card { fill: #F6F8FA; }
    .edge { stroke: #D1D9E0; }
    .lbl { font-weight: 600; fill: #1F2328; }
    .val { font-weight: 700; fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161B22; }
      .edge { stroke: #30363D; }
      .lbl { fill: #E6EDF3; }
    }
  </style>
  <g>
    <rect class="card" x="0.5" y="0.5" width="131.3" height="31" rx="8"/>
    <g clip-path="url(#license-clip)">
      <rect x="0.5" y="0.5" width="5" height="31" fill="url(#license-accent)"/>
    </g>
    <g transform="translate(13, 7)"><rect x="3" y="1.5" width="11" height="14" rx="1.6" fill="#E5E7EB"/><rect x="5" y="4.5" width="7" height="1.4" rx="0.7" fill="#9CA3AF"/><rect x="5" y="7.5" width="5" height="1.4" rx="0.7" fill="#9CA3AF"/><circle cx="13" cy="13" r="3.4" fill="#737373" stroke="#FFFFFF" stroke-width="1"/></g>
    <text class="lbl" x="38" y="20.4">License</text>
    <rect class="chip" x="87.9" y="3.5" width="39.4" height="25" rx="6.5" fill="url(#license-accent)"/>
    <text class="val" x="107.6" y="20.4" text-anchor="middle">MIT</text>
    <rect class="edge" x="0.5" y="0.5" width="131.3" height="31" rx="8" fill="none"/>
  </g>
</svg>
