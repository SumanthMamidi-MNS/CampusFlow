<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170.6 32" width="170.6" height="32" fill="none" role="img" aria-label="FastAPI: REST + WS">
  <defs>
    <linearGradient id="fastapi-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <clipPath id="fastapi-clip">
      <rect x="0.5" y="0.5" width="169.6" height="31" rx="8"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; }
    .card { fill: #F6F8FA; }
    .edge { stroke: #D1D9E0; }
    .lbl { font-weight: 600; fill: #1F2328; }
    .val { font-weight: 700; fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161B22; }
      .edge { stroke: #30363D; }
      .lbl { fill: #E6EDF3; }
    }
  </style>
  <g>
    <rect class="card" x="0.5" y="0.5" width="169.6" height="31" rx="8"/>
    <g clip-path="url(#fastapi-clip)">
      <rect x="0.5" y="0.5" width="5" height="31" fill="url(#fastapi-accent)"/>
    </g>
    <g transform="translate(13, 7)"><circle cx="8.5" cy="8.5" r="8" fill="#009688"/><path d="M9.6 3 L5 10 H9.2 L8.3 14 L13 8.2 H9.2 L10.1 3 Z" fill="#FFFFFF"/></g>
    <text class="lbl" x="38" y="20.4">FastAPI</text>
    <rect class="chip" x="88.3" y="3.5" width="77.3" height="25" rx="6.5" fill="url(#fastapi-accent)"/>
    <text class="val" x="126.9" y="20.4" text-anchor="middle">REST + WS</text>
    <rect class="edge" x="0.5" y="0.5" width="169.6" height="31" rx="8" fill="none"/>
  </g>
