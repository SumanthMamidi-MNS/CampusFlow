<svg xmlns="http://www.w3.org/2000/svg" width="183.4" height="31" viewBox="0 0 183.4 31" fill="none" role="img" aria-label="FastAPI REST + WS">
  <title>FastAPI: REST + WS</title>
  <defs>
    <linearGradient id="bg_fastapi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161D29" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0A0E16" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="sheen_fastapi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow_fastapi" x="-60%" y="-160%" width="220%" height="420%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip_fastapi">
      <rect x="0.75" y="0.75" width="181.9" height="29.5" rx="14.75"/>
    </clipPath>
    <style>
      @keyframes gem_pulse_fastapi {
        0%, 100% { transform: scale(0.92); transform-origin: 16px 15.5px; }
        50% { transform: scale(1.16); transform-origin: 16px 15.5px; }
      }
      .gem-fastapi { animation: gem_pulse_fastapi 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .gem-fastapi { animation: none; } }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="181.9" height="29.5" rx="14.75" fill="url(#bg_fastapi)"/>
  <rect x="0.75" y="0.75" width="181.9" height="29.5" rx="14.75" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2">
    <animate attributeName="stroke" values="#FFFFFF;#34D399;#FFFFFF" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.18;0.85;0.18" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
  <path d="M 14 1.5 L 169.4 1.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="0.9" stroke-linecap="round"/>

  <g clip-path="url(#clip_fastapi)">
    <g transform="rotate(14)">
      <rect x="-30" y="-40" width="233.4" height="18" fill="url(#sheen_fastapi)" opacity="0">
        <animateTransform attributeName="transform" type="translate" additive="sum"
          values="0 -30; 0 71; 0 71; 0 -30" keyTimes="0; 0.45; 0.50; 1"
          dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.8; 0.8; 0; 0" keyTimes="0; 0.10; 0.40; 0.46; 1"
          dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <circle cx="16" cy="15.5" r="3.8" fill="none" stroke="#34D399">
    <animate attributeName="r" values="3.8;8.5;12" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.25;0" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#glow_fastapi)">
    <circle class="gem-fastapi" cx="16" cy="15.5" r="3.7" fill="#34D399"/>
  </g>
  <circle cx="16" cy="15.5" r="1.3" fill="#FFFFFF" opacity="0.92"/>

  <text x="28" y="19.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" letter-spacing="0.2">FastAPI</text>
  <line x1="92.3" y1="9" x2="92.3" y2="22" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
  <text x="102.3" y="19.6" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="0.25">REST + WS
    <animate attributeName="fill" values="#94A3B8;#34D399;#94A3B8" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
